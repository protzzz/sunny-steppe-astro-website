# Weekly: one PR for minor/patch updates, separate PRs for major versions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is not supported yet by @astrojs/check (5–6) and @typescript-eslint/parser (<6.1).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
