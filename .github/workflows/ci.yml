name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Site URL: repository variable SITE_URL, else the production domain.
    env:
      PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://sunnysteppe.kz' }}
      # Fake GA4 ID: this build is only tested, never deployed.
      PUBLIC_GA_ID: G-TEST000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

      - run: npx astro check
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npx astro build
      - run: node scripts/check-build.mjs

      # Browser cache per Playwright version; system libraries every run.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Tests the build above. test:e2e:dev is local only.
      - run: npx playwright test
        env:
          E2E_PREBUILT: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
